name: Build
on: [push]

jobs:
  build:
    name: Build
    runs-on: macOS-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0.1"
      - uses: actions/checkout@v1
      - name: Clean
        run: xcodebuild -scheme OpenVanilla -configuration Release clean
      - name: Clean
        run: xcodebuild -scheme OpenVanillaInstaller -configuration Release clean
      - name: Build
        run: xcodebuild -scheme OpenVanilla -configuration Release build
      - name: Build
        run: xcodebuild -scheme OpenVanillaInstaller -configuration Release build
      - name: Test associated phrase tables
        run: |
          clang++ -std=c++11 -I Packages/OpenVanilla/Sources/OpenVanilla/include -I Packages/OpenVanilla/Sources/OVAFAssociatedPhrases/include Tests/AssociatedPhrasesTests.cpp Packages/OpenVanilla/Sources/OVAFAssociatedPhrases/OVAFAssociatedPhrases.cpp Packages/OpenVanilla/Sources/OVAFAssociatedPhrases/OVAFAssociatedPhrasesContext.cpp -o /tmp/associated-phrases-tests
          /tmp/associated-phrases-tests DataTables/associated-phrases.cin
